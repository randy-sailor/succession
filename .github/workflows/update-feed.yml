name: Update feed

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch: {}      # lets you run it from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python3 -I scripts/build_feed.py

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- index.html feed/feed.json; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "succession-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html feed/feed.json
          git commit -m "Update feed $(date -u +%F)"
          git push
